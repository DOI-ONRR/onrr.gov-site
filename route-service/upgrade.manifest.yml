---
applications:
- name: upgrade-onrr-route-service
  default-route: true
  buildpacks:
    - nodejs_buildpack
  instances: 1
  disk_quota: 1G
  memory: 512M
  env:
    CMS_HOST: upgrade-onrr-cms.apps.internal
    FRONTEND_HOST: upgrade-onrr-frontend.apps.internal
    # CMS allowed to frame the site (live preview); see security-headers.js
    FRAME_ANCESTORS: https://upgrade-onrr-cms.app.cloud.gov
