---
applications:
- name: preview-onrr-route-service
  default-route: true
  buildpacks:
    - nodejs_buildpack
  instances: 1
  disk_quota: 1G
  memory: 512M
  env:
    CMS_HOST: preview-onrr-cms.apps.internal
    FRONTEND_HOST: preview-onrr-frontend.apps.internal
    # CMS allowed to frame the site (live preview); see security-headers.js
    FRAME_ANCESTORS: https://preview-onrr-cms.app.cloud.gov
