---
applications:
- name: prod-onrr-route-service
  default-route: true
  routes:
  - route: onrr.gov
  - route: www.onrr.gov
  buildpacks:
    - nodejs_buildpack
  instances: 2
  disk_quota: 1G
  memory: 512M
  env:
    CMS_HOST: prod-onrr-cms.apps.internal
    FRONTEND_HOST: prod-onrr-frontend.apps.internal
    # CMS allowed to frame the site (live preview); see security-headers.js
    FRAME_ANCESTORS: https://prod-onrr-cms.app.cloud.gov
