---
applications: 
- name: preview-onrr-cms
  command: npx directus start
  instances: 1
  disk_quota: 5G
  memory: 2G
  routes:
  - route: preview-onrr-cms.apps.internal
  - route: preview-onrr-cms.app.cloud.gov
  buildpacks:
    - nodejs_buildpack
  services:
    - preview-onrr-psql
    - preview-onrr-s3
    - preview-onrr-redis
  env:
    CONFIG_PATH: ./config.js
    UPSTREAM_URL: https://dev-onrr-cms.app.cloud.gov
    DIRECTUS_PUBLIC_HOST: https://preview-onrr-cms.app.cloud.gov
    # Roles allowed to call the onrr-flows endpoints (cms/config.js)
    ONRR_FLOWS_ALLOWED_ROLES: Admin,Events,Service Account
    PUBLIC_URL: https://preview-onrr-cms.app.cloud.gov
    # The revenue data update now yields to the event loop (CSV parse + per-record loops)
    # and bulk-inserts, so it no longer stalls past the pressure limiter's default threshold
    # (left at default so the limiter stays a canary for future regressions). Keep only
    # Retry-After so a shed client is still told when to retry.
    PRESSURE_LIMITER_RETRY_AFTER: 10