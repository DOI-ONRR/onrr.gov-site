---
applications: 
- name: upgrade-onrr-cms
  command: ./node_modules/.bin/directus start
  instances: 1
  disk_quota: 5G
  memory: 1536M
  buildpacks:
    - nodejs_buildpack
  services:
    - upgrade-onrr-psql
    - upgrade-onrr-s3
  env:
    CONFIG_PATH: ./config.js
    UPSTREAM_URL: https://preview-onrr-cms.app.cloud.gov
    DIRECTUS_PUBLIC_HOST: https://upgrade-onrr-cms.app.cloud.gov
    # Roles allowed to call the onrr-flows endpoints (cms/config.js)
    ONRR_FLOWS_ALLOWED_ROLES: Admin,Events,Service Account
    PUBLIC_URL: https://upgrade-onrr-cms.app.cloud.gov