name: Route Service Pipeline

on:
  push:
    paths: 'route-service/**'
    branches-ignore:
      - main
      - dev
  
  pull_request:
    paths: 'route-service/**'
    types: [closed]
    branches:
      - dev
      - main

  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: these jobs only read the repository
# (deploy credentials come from secrets, not the token).
permissions:
  contents: read

jobs:
  deploy-route-service:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    # Prod cloud.gov credentials live only in the `prod` environment, which is
    # restricted to the main branch; every other branch gets `non-prod`.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'non-prod' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Deploy frontend
        working-directory: route-service
        run: ../.github/scripts/deploy.sh --branch "$BRANCH"
        env:
          BRANCH: ${{ github.ref_name }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}