name: Check Links

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # runs weekly on Sunday at 3am UTC

# Least privilege for GITHUB_TOKEN: these jobs only read the repository
# (deploy credentials come from secrets, not the token).
permissions:
  contents: read

jobs:
  crawl-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install crawler dependencies
        run: |
          cd .github/site-crawl
          npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: .github/site-crawl

      - name: Run crawler
        run: npm start
        working-directory: .github/site-crawl

      - name: Export URLs for Lychee
        run: |
          cd .github/site-crawl
          npm run export-links

      - name: Upload found-links.json artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: found-links
          path: .github/site-crawl/found-links.json

      - name: Run Lychee link checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >
            --verbose
            --no-progress
            --max-concurrency 10
            .github/site-crawl/all-urls.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-check-results
          path: |
            .github/site-crawl/found-links.json
            .github/site-crawl/all-urls.txt
