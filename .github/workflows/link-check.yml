name: Check Links

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # runs weekly on Sunday at 3am UTC

# Least privilege for GITHUB_TOKEN: these jobs only read the repository
# (deploy credentials come from secrets, not the token).
permissions:
  contents: read

jobs:
  crawl-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install crawler dependencies
        run: |
          cd .github/site-crawl
          npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: .github/site-crawl

      - name: Run crawler
        run: npm start
        working-directory: .github/site-crawl

      - name: Export URLs for Lychee
        run: |
          cd .github/site-crawl
          npm run export-links

      - name: Upload found-links.json artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: found-links
          path: .github/site-crawl/found-links.json

      - name: Run Lychee link checker
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          args: >
            --verbose
            --no-progress
            --max-concurrency 10
            .github/site-crawl/all-urls.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: link-check-results
          path: |
            .github/site-crawl/found-links.json
            .github/site-crawl/all-urls.txt
