name: Frontend Pipeline

on:
  push:
    paths: 'frontend/**'
    branches-ignore:
      - main
      - dev
  
  pull_request:
    paths: 'frontend/**'
    types: [closed]
    branches:
      - dev
      - main

  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: these jobs only read the repository
# (deploy credentials come from secrets, not the token).
permissions:
  contents: read

jobs:
  build-frontend:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    env:
      VUE_APP_HOME_PAGE_ID: ${{ secrets.VUE_APP_HOME_PAGE_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install CMS dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build:deploy
        working-directory: frontend
        env:
          VUE_APP_ONRR_GTM_ID: ${{ secrets.VUE_APP_ONRR_GTM_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: frontend/dist

  deploy-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    # Prod cloud.gov credentials live only in the `prod` environment, which is
    # restricted to the main branch; every other branch gets `non-prod`.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'non-prod' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: frontend/dist

      - name: Overwrite robots.txt
        if: github.ref_type == 'branch' && github.ref_name == 'dev'
        run: |
          mv ./frontend/dist/robots-dev.txt ./frontend/dist/robots.txt

      - name: Deploy frontend
        working-directory: frontend
        run: ../.github/scripts/deploy.sh --branch "$BRANCH"
        env:
          BRANCH: ${{ github.ref_name }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}