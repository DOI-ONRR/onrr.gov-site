name: Secret scan

# Fails if new commits add secrets or credential/dump files (fix/4319). Only the
# commits being pushed or proposed are scanned: older history already contains
# known, rotated leaks. This catches mistakes before merge; GitHub push
# protection (repo settings) is what blocks known token formats at push time.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Work out which commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$AFTER"
          else
            # New branch or force-push: everything on this branch that isn't on main.
            RANGE="$(git merge-base origin/main "$AFTER")..$AFTER"
          fi
          echo "Scanning $RANGE ($(git rev-list --count "$RANGE") commit(s))"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      # gitleaks skips binary changes, so database dumps are blocked by file
      # name here. Keep in sync with the credential/dump rules in .gitignore.
      - name: Block database dumps and credential files
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          FORBIDDEN='(\.(pg|dump|backup)$|\.sql\.gz(\.age)?$|(^|/)backup\.sql$|(^|/)database/backup/|(^|/)(\.tunnelrc|\.pgpass|\.env)$|\.creds$|(^|/)id_(rsa|ed25519|ecdsa|dsa)[^/]*$|\.(pem|p12|pfx)$)'
          FOUND="$(git log --format= --name-only --diff-filter=ACMR "$RANGE" | sort -u | grep -iE "$FORBIDDEN" || true)"
          if [ -n "$FOUND" ]; then
            while IFS= read -r f; do echo "::error file=$f::Credential or database dump file must not be committed: $f"; done <<<"$FOUND"
            exit 1
          fi
          echo "No dump or credential files added."

      - name: Scan commits for secrets (gitleaks)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --log-opts="$RANGE" \
            --redact --no-banner --verbose --exit-code 1
