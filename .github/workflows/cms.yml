name: CMS Pipeline

# Deploys run on push, including the push a merged PR makes to dev/main, so
# github.ref is the real branch (refs/heads/main). The prod environment's
# branch rule checks that ref; a pull_request run would present
# refs/pull/<n>/merge instead and be refused.
on:
  push:
    paths: 'cms/**'

  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: these jobs only read the repository
# (deploy credentials come from secrets, not the token).
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Ok to proceed with build"
  build-cms-extensions:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install CMS dependencies
        run: npm ci
        working-directory: cms

      # The extensions each vendor their own @directus/extensions-sdk, so a cold
      # install of all of them is what dominates this job's wall-clock. Cache the
      # installed node_modules keyed on every extension lockfile: an unchanged set
      # restores and skips the install entirely; otherwise install them in
      # parallel below (which also replaces the former one-step-per-extension
      # sequential installs).
      - name: Cache extension node_modules
        id: ext-deps-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cms/src/extensions/*/*/node_modules
          key: ext-node-modules-v1-${{ runner.os }}-node22-${{ hashFiles('cms/src/extensions/*/*/package-lock.json') }}

      - name: Install extension dependencies (parallel, on cache miss)
        if: steps.ext-deps-cache.outputs.cache-hit != 'true'
        working-directory: cms
        run: |
          # Install up to 4 extensions concurrently (the runner has 4 vCPUs).
          # The directory is passed as a positional arg ("$1") so no path is
          # interpolated into the shell command. xargs exits non-zero if any
          # install fails, which fails the step.
          ls -d src/extensions/*/*/ \
            | while read -r d; do [ -f "${d}package.json" ] && printf '%s\n' "$d"; done \
            | xargs -P4 -I{} sh -c 'cd "$1" && npm ci' _ {}

      - name: Build extensions
        run: npm run build:all
        working-directory: cms

      - name: Create CMS deploy tarball (node_modules + built extensions only)
        run: |
          # Archive only the built Directus extensions
          tar -czf cms-deploy.tar.gz cms/extensions

      - name: Upload CMS deploy tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cms-deploy-tar
          path: cms-deploy.tar.gz

  build-tinymce:
    needs: build-cms-extensions
    runs-on: ubuntu-latest
    env:
      TINYMCE_REF: "8.0.2"
      DEPLOY_DIR: "cms/extensions/directus-extension-onrr-wysiwyg/public/tinymce"
      SRC_DIR: "source/cms/src/extensions/interfaces/onrr-wysiwyg"
    steps:
      - name: Download CMS deploy tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cms-deploy-tar
          path: .

      - name: Extract CMS deploy tarball
        run: |
          tar -xzf cms-deploy.tar.gz

      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: source

      # Building the Oxide skin (tinymce checkout + yarn + oxide-build) only
      # produces different output when the pinned TinyMCE ref or our skin LESS
      # changes. Cache the compiled output keyed on both and skip the whole
      # build on a hit. Bump the v1 token to force a rebuild.
      - name: Cache compiled TinyMCE Oxide skin
        id: tinymce-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tinymce-oxide-build
          key: tinymce-oxide-v1-${{ env.TINYMCE_REF }}-${{ hashFiles('source/cms/src/extensions/interfaces/onrr-wysiwyg/src/tinymce/modules/oxide/src/less/skins/ui/default/**') }}

      - name: Checkout TinyMCE (shallow)
        if: steps.tinymce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tinymce/tinymce
          ref: ${{ env.TINYMCE_REF }}
          path: tinymce
          fetch-depth: 1

      - name: Setup Node for TinyMCE
        if: steps.tinymce-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            tinymce/yarn.lock
            tinymce/package-lock.json

      - name: Copy TinyMCE skin LESS
        if: steps.tinymce-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p tinymce/modules/oxide/src/less/skins/ui/default/
          shopt -s nullglob
          cp -v "${SRC_DIR}/src/tinymce/modules/oxide/src/less/skins/ui/default/"* \
                "tinymce/modules/oxide/src/less/skins/ui/default/"
          shopt -u nullglob

      - name: Build TinyMCE Oxide
        if: steps.tinymce-cache.outputs.cache-hit != 'true'
        working-directory: tinymce
        run: |
          yarn
          yarn oxide-build
          # Stage the compiled skin under the cached path so the next run with an
          # unchanged ref + LESS restores it and skips everything above.
          mkdir -p ../tinymce-oxide-build
          cp -R modules/oxide/build/. ../tinymce-oxide-build/

      - name: Copy compiled TinyMCE into extension
        run: |
          mkdir -p "${DEPLOY_DIR}"
          cp -R tinymce-oxide-build/. "${DEPLOY_DIR}/"

      - name: Re-pack CMS deploy tarball
        run: |
          rm -f cms-deploy.tar.gz
          tar -czf cms-deploy.tar.gz cms

      - name: Upload final CMS deploy tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cms-deploy-tar
          path: cms-deploy.tar.gz
          overwrite: true

  deploy-cms:
    needs: build-tinymce
    runs-on: ubuntu-latest
    # Prod cloud.gov credentials live only in the `prod` environment, which is
    # restricted to the main branch; every other branch gets `non-prod`.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'non-prod' }}
    steps:
      - name: Checkout repo (for deploy.sh & manifests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download CMS deploy tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cms-deploy-tar
          path: .

      - name: Extract CMS deploy tarball (overlays repo cms/)
        run: |
          tar -xzf cms-deploy.tar.gz
          echo "After extract in deploy-cms, workspace contents:"
          ls

      - name: Deploy CMS
        working-directory: cms
        run: ../.github/scripts/deploy.sh --branch "$BRANCH"
        env:
          BRANCH: ${{ github.ref_name }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}