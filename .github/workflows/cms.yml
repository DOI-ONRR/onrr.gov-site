name: CMS Pipeline

on:
  push:
    paths: 'cms/**'
    branches-ignore:
      - main
  
  pull_request:
    paths: 'cms/**'
    types: [closed]
    branches:
      - dev
      - main

  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - run: echo "Ok to proceed with build"

  build-cms-extensions:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install CMS dependencies
        run: npm ci
        working-directory: cms

      - name: Install document dependencies
        run: npm ci
        working-directory: cms/src/extensions/endpoints/document

      - name: Install image-uploader dependencies
        run: npm ci
        working-directory: cms/src/extensions/endpoints/image-uploader

      - name: Install link-autocomplete dependencies
        run: npm ci
        working-directory: cms/src/extensions/endpoints/link-autocomplete

      - name: Install onrr-flows dependencies
        run: npm ci
        working-directory: cms/src/extensions/endpoints/onrr-flows

      - name: Install press-releases dependencies
        run: npm ci
        working-directory: cms/src/extensions/endpoints/press-releases

      - name: Install reporter-letters dependencies
        run: npm ci
        working-directory: cms/src/extensions/endpoints/reporter-letters

      - name: Install unbundling dependencies
        run: npm ci
        working-directory: cms/src/extensions/endpoints/unbundling

      - name: Install index-zones dependencies
        run: npm ci
        working-directory: cms/src/extensions/hooks/index-zones

      - name: Install indian-gas-major-portion dependencies
        run: npm ci
        working-directory: cms/src/extensions/hooks/indian-gas-major-portion

      - name: Install ibmp dependencies
        run: npm ci
        working-directory: cms/src/extensions/hooks/ibmp

      - name: Install nymex dependencies
        run: npm ci
        working-directory: cms/src/extensions/hooks/nymex

      - name: Install onrr-editor dependencies
        run: npm ci --legacy-peer-deps
        working-directory: cms/src/extensions/interfaces/onrr-editor

      - name: Install wysiwyg-static dependencies
        run: npm ci
        working-directory: cms/src/extensions/endpoints/wysiwyg-static

      - name: Install onrr-wysiwyg dependencies
        run: npm ci
        working-directory: cms/src/extensions/interfaces/onrr-wysiwyg

      - name: Install onrr-generate-uuid dependencies
        run: npm ci
        working-directory: cms/src/extensions/operations/onrr-generate-uuid

      - name: Build extensions
        run: npm run build:all
        working-directory: cms


      - name: Upload CMS deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-deploy
          path: cms

  build-tinymce:
    needs: build-cms-extensions
    runs-on: ubuntu-latest
    env:
      TINYMCE_REF: "8.0.2"
      DEPLOY_DIR: "cms/extensions/directus-extension-onrr-wysiwyg/public/tinymce"
      SRC_DIR: "source/cms/src/extensions/interfaces/onrr-wysiwyg"
    steps:
      - name: Download CMS deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: cms-deploy
          path: .

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: source

      - name: Checkout TinyMCE (shallow)
        uses: actions/checkout@v4
        with:
          repository: tinymce/tinymce
          ref: ${{ env.TINYMCE_REF }}
          path: tinymce
          fetch-depth: 1

      - name: Setup Node for TinyMCE
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            tinymce/yarn.lock
            tinymce/package-lock.json

      - name: Copy TinyMCE skin LESS
        shell: bash
        run: |
          mkdir -p tinymce/modules/oxide/src/less/skins/ui/default/
          shopt -s nullglob
          cp -v "${SRC_DIR}/src/tinymce/modules/oxide/src/less/skins/ui/default/"* \
                "tinymce/modules/oxide/src/less/skins/ui/default/"
          shopt -u nullglob
      
      - name: Build TinyMCE Oxide 
        working-directory: tinymce
        run: |
          yarn
          yarn oxide-build

      - name: Copy compiled TinyMCE into extension
        run: |
          mkdir -p "${DEPLOY_DIR}"
          cp -R tinymce/modules/oxide/build/* "${DEPLOY_DIR}/"

      - name: Upload final CMS deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-deploy
          path: cms
          overwrite: true

  deploy-cms:
    needs: build-tinymce
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for deploy.sh & manifests)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download CMS deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: cms-deploy
          path: .

      - name: Prepare CMS tree for vendored deploy
        run: |
          echo "Before cleanup:"
          ls -d cms/node_modules || echo "cms/node_modules is missing BEFORE cleanup!"
          echo
          echo "Lockfiles BEFORE cleanup:"
          find cms -name "package-lock.json" -o -name "npm-shrinkwrap.json" -o -name "yarn.lock" -o -name "pnpm-lock.yaml" || true
          echo
          # If node_modules is missing here, fail fast so we know the artifact didn't contain deps
          if [ ! -d "cms/node_modules" ]; then
            echo "ERROR: cms/node_modules is missing; cms-deploy artifact does not contain vendored dependencies."
            exit 1
          fi
          echo "Removing nested node_modules (keeping cms/node_modules)..."
          find cms -mindepth 2 -type d -name node_modules -prune -exec rm -rf '{}' +
          echo "Removing lockfiles..."
          find cms -name "package-lock.json" -delete
          find cms -name "npm-shrinkwrap.json" -delete
          find cms -name "yarn.lock" -delete
          find cms -name "pnpm-lock.yaml" -delete

      - name: Inspect CMS deploy tree
        run: |
          echo "Top-level contents after cleanup:"
          ls -R | head -200
          echo
          echo "Any lockfiles after cleanup? (should be none)"
          find cms -name "package-lock.json" -o -name "npm-shrinkwrap.json" -o -name "yarn.lock" -o -name "pnpm-lock.yaml" || true
          echo
          echo "Does cms/node_modules exist after cleanup?"
          ls -d cms/node_modules || echo "cms/node_modules is missing AFTER cleanup!"

      - name: Deploy CMS
        run: .github/scripts/deploy.sh --branch ${{ github.ref_name }}
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}