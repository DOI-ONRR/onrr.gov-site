#import "./contentBlockFields.gql"
#import "./tabBlockFields.gql"
#import "./cardBlockFields.gql"
#import "./expansionPanelBlockFields.gql"
#import "./layoutColumnBlockFields.gql"
#import "./formulaBlockFields.gql"
#import "./collectionBlockFields.gql"
#import "./chartCardFields.gql"

fragment pageFields on pages {
  id
  title
  slug
  parent {
    title
    url
    parent {
      title
    }
  }
  hero_image {
    id
    description
  }
  hero_title
  dataset_metadata {
    id
    name
    description
    update_frequency
    formats
    coverage_start
    coverage_end
    publisher
    related_links
    about
    terms {
      glossary_terms_id {
        id
        term
        definition
      }
    }
    charts(sort: ["sort"]) {
      ...chartCardFields
    }
  }
  page_blocks {
    id
    item {
      __typename
      ... on content_blocks {
        ...contentBlockFields
      }
      ... on tab_blocks {
        ...tabBlockFields
      }
      ... on card_blocks {
        ...cardBlockFields
      }
      ... on expansion_panels {
        ...expansionPanelBlockFields
      }
      ... on layout_column_blocks {
        ...layoutColumnBlockFields
      }
      ... on collection_blocks {
        ...collectionBlockFields
      }
      ... on chart_cards {
        ...chartCardFields
      }
    }
  }
  sidebar_blocks {
    id
    item {
      ... on content_blocks {
        ...contentBlockFields
        __typename
      }
      ... on collection_blocks {
        ...collectionBlockFields
        __typename
      }
    }
    __typename
  }
  meta_title
  meta_description
}
