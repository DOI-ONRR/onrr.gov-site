#import "../../../fragments/eventFields.gql"

# All upcoming, published events, soonest first. The events page groups these
# client-side by event_category (reporter_training / indian_outreach / other).
query GetEvents {
  events(
    filter: {
      status: { _eq: "published" }
      event_end_date: { _gte: "$NOW" }
    }
    sort: ["event_start_date"]
  ) {
    ...eventFields
  }
}
